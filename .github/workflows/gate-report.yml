name: gate-report

# Installation candidate. Trusted default-branch code reads bounded data only.
run-name: Smoothie gate report for run ${{ inputs.run_id }}

# Started by the build workflow's final trusted job. GitHub does not fire workflow_run for runs
# created with the Actions token, so an explicit dispatch (an exempt event) carries the run number.
# The number is only a request: the publisher authenticates that exact run through the API.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed gate-build run to report
        required: true
        type: string

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  checks: write
  copilot-requests: write

# The authenticated worker's title is exactly "Smoothie gate PR <number>".
# This serializes attempts for the same PR; the API adapter rejects other titles.
concurrency:
  group: gate-report-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GATE_REF: ${{ vars.GATE_REF }}
      SIM_REF: ${{ vars.SIM_REF }}
      POLICY_JSON: ${{ vars.GATE_POLICY_JSON }}
      TARGET_REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Require exact trusted pins and prepare private report state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GATE_REF" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "$SIM_REF" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir "$RUNNER_TEMP/gate-reporter"
          printf '%s' "$POLICY_JSON" > "$RUNNER_TEMP/gate-reporter/policy.json"

      - name: Check out trusted report code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.GATE_REPO }}
          ref: ${{ vars.GATE_REF }}
          path: gate
          persist-credentials: false

      - name: Check out the pinned simulator for the review rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SIM_REPO }}
          ref: ${{ vars.SIM_REF }}
          path: sim
          persist-credentials: false

      - name: Install GitHub Copilot CLI for the model review
        continue-on-error: true  # the gateway fallback still works without it
        run: npm install --global @github/copilot@1.0.105

      - name: Wait for the dispatching build run to complete (bounded)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            state=$(gh api "repos/$TARGET_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .status)
            [[ "$state" == completed ]] && exit 0
            sleep 5
          done
          echo 'build run did not complete in time' >&2; exit 2

      - name: Authenticate and publish the current firmware report
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AI_COPILOT: '1'
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN || github.token }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODELS: ${{ vars.AI_MODELS }}
          AI_PUBLIC_SOURCE: ${{ github.event.repository.private == false && '1' || '0' }}
        run: |
          set -euo pipefail
          python3 -B -I gate/scripts/github_config.py \
            --policy "$RUNNER_TEMP/gate-reporter/policy.json" --controller "$GITHUB_WORKSPACE/gate" \
            --repository "$TARGET_REPOSITORY" --gate-ref "$GATE_REF" --sim-ref "$SIM_REF" \
            --out "$RUNNER_TEMP/gate-reporter/config.json"
          python3 -B -I gate/scripts/github_publisher.py \
            --policy "$RUNNER_TEMP/gate-reporter/policy.json" --run-id "$SOURCE_RUN_ID" \
            --out "$RUNNER_TEMP/gate-reporter/publication" \
            --sim-dir "$GITHUB_WORKSPACE/sim"

      - name: Retain report and exact publication recovery receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-report-${{ inputs.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gate-reporter/publication/report/
            ${{ runner.temp }}/gate-reporter/publication/check.json
            ${{ runner.temp }}/gate-reporter/publication/comment.json
          if-no-files-found: ignore
          retention-days: 7
